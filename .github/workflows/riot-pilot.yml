name: PICKOU KR Riot pilot
on:
  push:
    branches: [main]
    paths:
      - rift/discovery.py
      - rift/pilot.py
      - rift/quality.py
      - scripts/run_pilot.py
      - .github/workflows/riot-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: riot-api-key-worker
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation
        run: python -m unittest discover -s tests -v
      - name: Read saved read-only Sheets validation summary
        run: python scripts/validate_sheets_mapping.py --summary-only
      - name: Collect up to 100 valid KR matches
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python scripts/run_pilot.py --target 100
      - name: Publish truthful pilot result including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickou-kr-pilot
          path: |
            reports/collection/
            reports/sheets_mapping_validation.json
            data/rift.sqlite3
          if-no-files-found: warn
          retention-days: 7
